name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/deploy-pages: `pages` to publish, `id-token` for its OIDC
# handshake with the Pages service.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a merged PR is
# always the version that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `package-manager` input on purpose. The action detects pnpm from
      # pnpm-lock.yaml and then defers the version to `packageManager` in
      # package.json. Naming it without a version makes the action pass
      # `version: latest` to pnpm/action-setup, which refuses to run alongside
      # the `packageManager` pin: "Multiple versions of pnpm specified".
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
