type: object
properties:
  id:
    description: Project ID
    example: 50a9f72f14db3be812000233
    type: string
  title:
    description: Project title
    type: string
  url:
    description: Project base URL
    example: https://testomato.com
    type: string
  period:
    description: Period of test checking — `false` means tests are not run automatically.
    default: 5 minutes
    enum: [ 5 minutes, 30 minutes, 1 hour, 8 hours, 1 day, 7 days, false ]
    type: string
  uptimeUrl:
    description: Uptime URL
    type: string
  uptimeEnabled:
    description: Uptime period in seconds - `false` means uptime is disabled
    type: string
    enum: [ false, 15, 30, 60 ]
  apiKey:
    description: apiKey that can be used for the project operations
    example: 123456
    type: string
  payerId:
    description: Identification of the project owner.
    type: integer
  location:
    description: Project check location
    type: string
    enum: [ eu, de, gb, ca, us, tx, dc, sg, hk ]
  checkDefaultErrors:
    type: boolean
    default: true
  created:
    description: Date and time of project creation
    type: string
    format: date-time
  userAgent:
    description: User agent
    default: Testomatobot/1.0 (Linux x86_64; +https://testomato.com/bot) minicrawler/5.2.7
    type: string
  timeout:
    description: Cumulated project timeout in seconds
    type: integer
    default: 3
  delay:
    description: Bulk request delay in milliseconds
    type: integer
    format: int64
    default: 50
  userIds:
    type: array
    description: Array of user IDs with access to the project
    items:
      type: integer
  status:
    description: Last known check status of the project. `null` until the first run.
    type: string
    nullable: true
    example: ok
  sslStatus:
    description: |
      Derived state of the TLS certificate:

      - `ok` — valid, and more days left than `sslAlertPeriod`
      - `soon` — valid, but expiring within `sslAlertPeriod`
      - `expired` — no days left
      - `nossl` — the project URL is not `https://`
      - `noinfo` — not checked yet
    type: string
    enum: [ ok, soon, expired, nossl, noinfo ]
    example: ok
  sslExpiration:
    description: Certificate expiry in ISO 8601. `null` when there is nothing to report.
    type: string
    format: date-time
    nullable: true
    example: "2026-12-31T23:59:59+00:00"
  sslDaysLeft:
    description: Days until the certificate expires. Absent until the first SSL check ran.
    type: integer
    example: 47
  sslAlertPeriod:
    description: How many days before expiry the certificate counts as expiring soon.
    type: integer
    example: 14
  httpsRedirectEnabled:
    description: Whether Testomato checks that the HTTP version redirects to HTTPS.
    type: boolean
    example: true
  httpsRedirectStatus:
    description: Result of the last HTTPS redirect check. `null` until it first ran.
    type: string
    enum: [ ok, failed, unreachable ]
    nullable: true
    example: ok
  httpsRedirectFinalUrl:
    description: URL the HTTP version ended on, after following redirects.
    type: string
    nullable: true
    example: https://testomato.com/
  httpsRedirectCheckedAt:
    description: When the HTTPS redirect was last checked, in ISO 8601.
    type: string
    format: date-time
    nullable: true
    example: "2026-09-08T06:29:38+00:00"
  webPushEnabled:
    description: Whether browser push notifications are enabled for this project.
    type: boolean
    example: false
  securityMonitoringEnabled:
    description: Whether the security panel (including the Shodan network scan) is enabled.
    type: boolean
    example: false
  isWordPress:
    description: Whether the site was detected as WordPress. `null` before detection ran.
    type: boolean
    nullable: true
    example: true
  name:
    description: Project name was replaced by Project title
    type: string
    deprecated: true